<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Login Example</title>
</head>
<style>
  .para{
    font-family: Arial;
    font-size: 20px;
  }
  .mail{
    padding: 5px 12px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .safe{
    padding: 5px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .btn{
   padding: 8px 13px;
   margin-right: 3px;
   background-color: rgb(0, 123, 255);
   color: white;
   border: none;
   border-radius: 4px;
  }
  .bton{
   padding: 8px 13px;
   background-color: rgb(0, 123, 255);
   color: white;
   border: none;
   border-radius: 4px;
  }
</style>
<body>
    <div class="js-container"></div>

    <!-- ✅ Correct React + ReactDOM + Babel links -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
    function Login(){
      const [inputText, setInputText] = React.useState('Show');

      function change(){
        setInputText(inputText === 'Hide' ? 'Show' : 'Hide');
      }

      return ( 
        <>
          <p className='para'>Hello, welcome to my website</p>
          <div>
            <input className="mail" placeholder="Email" />
          </div>
          <div>
            <input 
              className='safe' 
              type={inputText === 'Hide' ? 'text' : 'password'}
              placeholder="Password" 
            />
            <button onClick={change}>{inputText}</button>
          </div>
          <div>
            <button className='btn'>Login</button>
            <button className='bton'>Sign up</button>
          </div>
        </>
      )
    }

    function App(){
      return <Login />
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
    </script>  
</body>
</html>
