<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button{
        background-color: rgb(25, 135, 84);
        border: none;
        color: white;
        padding-bottom: 3px;
        padding: 10px 20px;
        margin-left: 8px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .text-button{
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-radius: 10px;
        border-width: 2px;
        font-size: 15px;
        flex-grow: 1;
      }
      .chat-input-container{
        display: flex;
        margin-bottom: 15px;
        font-family: Arial;
        margin-top: 20px;
        margin-bottom: 60px;
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user{
       display: flex;
       justify-content: end;
       align-items: start;
      }

      .chat-message-robot{
        display: flex;
        align-items: start;
      }
      
      .chat-message-text {
         background-color: rgb(238, 238, 238);
         padding: 15px 20px;
         margin-left: 10px;
         margin-right: 10px;
         border-radius: 10px;
         margin-bottom: 20px;
         max-width: 300px;
      }
      .chat-message-profile{
        width: 46px;
      }

      .chat-messages-container {
        flex-grow: 1;  
        margin-top: 20px;
        overflow: scroll;  
        scrollbar-width: none;
       }
      
       .welcome-message{
        color: rgb(120, 120, 120);
        text-align: center;
       }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

     <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <!-- //above two scripts are for react and react-dom external libraries -->
    
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel"> 
    function ChatInput({chatMessage, setChatMessages}){
      const [inputText, setInputText]=React.useState('');
      const [isLoading, setIsLoading]=React.useState('');

      function saveInputText(event) {
        setInputText(event.target.value)
      }
      async function sendMessage(){
        if(isLoading || inputText=== ''){
          return;
        }
        
        setIsLoading(true)

        setInputText('');
        const newChatMessages = [
          ...chatMessage,
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID()
          }
         ]
         //setInputText(''); // at both places can be used to make the text box empty..
         
         setChatMessages(newChatMessages);
         setChatMessages([
          ...newChatMessages,
          //This creates a temporary Loading.. message;
          // because we don't save this message in newChatMessages,
          // it will be remove later, when we add the response.
          {
            message: 'Loading...',
            sender:'robot',
            id: crypto.randomUUID()
          }
         ])
         const response = await chatbot.getResponseAsync(inputText)
           
           setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID()
          }
         ])
        
        
         setIsLoading(false)
         //setInputText(''); //(01)

      }
      function pressKey(event){
        if(event.key === "Enter"){
          sendMessage()
        }
        if(event.key === "Escape"){
          setInputText('')
        }
      }
      return (
        <div className="chat-input-container">
          <input 
            placeholder="Send a message to the Chatbot" 
            size="30"
            onChange={saveInputText}
            onKeyDown={pressKey}
            value= {inputText} // used to make the text box empty.(01)
            className="text-button"
          />
          <button
          className="send-button"
          onClick={sendMessage}
          >Send</button>
        </div>
      );
    }

    function ChatMessage({message, sender}){ // destructuring shortcut
      // const message= props.message;
      // const sender = props.sender;
      // const {message,sender} = props; //shortcut

      /*
      if(sender=== 'robot'){
        return (
         <div>
          <img src="bot.png" width="50"/>
            {message}
          <div/> 
        )
      } 
        */
      
      return (
        <div className={
          sender==='user' ?
            'chat-message-user' :
            'chat-message-robot'
        }>
          {sender === 'robot' && (
            <img src="robot.png" 
            className="chat-message-profile"/>
          )}
          <div className="chat-message-text">
          {message}
          </div>
          {sender === 'user' && (
            <img src="user.png" 
            className="chat-message-profile"/>
          )}
        </div>
      )
    }
    function ChatMessages({chatMessage}){
      //  const /*array*/ [chatMessage, setChatMessages] = React.useState ([{
      //   message: 'hello chatbot',
      //   sender: 'user',
      //   id: 'id1'
      // },  {
      //   message: 'Hello! How can I help you?',
      //   sender: 'robot',
      //   id: 'id2'
      // }, {
      //   message: 'can you get me todays date?',
      //   sender: 'user',
      //   id: 'id3'
      // }, {
      //   message: 'Today is May 25',
      //   sender: 'robot',
      //   id: 'id4'
      // }])
      //const [chatMessage, setChatMessages] = array;
      //const chatMessage = array[0]; // gives us current value of chatMessages( the current data)
       //const setChatMessages = array[1];
      //  function sendMessage(){
      //    setChatMessages([
      //     ...chatMessage,
      //     {
      //       message: 'test',
      //       sender: 'user',
      //       id: crypto.randomUUID()
      //     }
      //    ])
      //  }
      const chatMessagesRef = React.useRef(null);  // null = intial value inside this container
      React.useEffect(() => {
         const containerElem = chatMessagesRef.current
         if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
         }
      }, [chatMessage]);
      return ( 
         <div className="chat-messages-container" 
         ref={chatMessagesRef}>
           {/*<button onClick={sendMessage}>Send message</button>*/}
          {chatMessage.map((chatMessage) =>{
                    return (
                      <ChatMessage
                      message={chatMessage.message}
                      sender={chatMessage.sender}
                      key= {chatMessage.id}
                      />
                      );}
              )}
              </div>
          );
  }
      
    function App(){
       const /*array*/ [chatMessage, setChatMessages] = React.useState (/*[{
        message: 'hello chatbot',
        sender: 'user',
        id: 'id1'
      },  {
        message: 'Hello! How can I help you?',
        sender: 'robot',
        id: 'id2'
      }, {
        message: 'can you get me todays date?',
        sender: 'user',
        id: 'id3'
      }, {
        message: 'Today is May 25',
        sender: 'robot',
        id: 'id4'
      }]*/[])

         return (
           <div className="app-container">
            {chatMessage.length === 0 && (
              <p className = "welcome-message">
                welcome to the chatbot project! Send a message using the textbox below.
                </p>
            )}
            <ChatMessages 
            chatMessage = {chatMessage}
            />
             <ChatInput
               chatMessage= {chatMessage} 
               setChatMessages={setChatMessages}
            />
          </div>
         ) 
    }
        
       const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
